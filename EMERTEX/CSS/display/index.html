<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .para {
        border: 2px solid red;
        display: inline-block;
        height: 200px;
        width: 200px;
      }
      span {
        border: 2px solid blue;
        height: 200px;
        width: 200px;
      }
    </style>
  </head>
  <body>
    <h2>Learning Block and Inline elements</h2>
    <p class="para para1">Lorem ipsum dolor sit amet.</p>
    <p class="para">
      Lorem ipsum dolor sit, amet consectetur adipisicing elit. Iure, mollitia.
    </p>
    <span>Lorem, ipsum.</span>
    <span>lorem2</span>
    <!--span is inline element,h and p are block elements-->
    <!--image is inline block,button is also inline...for in line we cannot give height and width-->
    <img src="../../HTML/Untitled.jpeg" width="100px" />
    <img src="../../HTML/Untitled.jpeg" />
  </body>
</html>
