<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grid</title>
    <style>
      .container {
        height: 95vh;
        display: grid;
        grid-template-rows: 1fr 2fr 1fr;
        grid-template-columns: 2fr 1fr 1fr;
      }
      .header {
        border: 1px solid red;
        background-color: beige;
        /*grid-row:start/end*/
        grid-row: 1/2;
        /*grid-column:start/end*/
        grid-column: 1/4;
      }
      .box {
        display: flex;
        font-size: xx-large;
        justify-content: center;
        align-items: center;
      }
      .article {
        border: 1px solid green;
        background-color: aquamarine;
        /*grid-row:start/end*/
        grid-row: 2/3;
        /*grid-column:start/end*/
        grid-column: 1/2;
      }
      .aside {
        border: 1px solid;
        background-color: cadetblue;
        /*grid-row:start/end*/
        grid-row: 2/3;
        /*grid-column:start/end*/
        grid-column: 2/3;
      }
      .navbar {
        border: 1px solid yellow;
        background-color: cornflowerblue;
        /*grid-row:start/end*/
        grid-row: 2/3;
        /*grid-column:start/end*/
        grid-column: 3/4;
      }
      .footer {
        border: 1px solid blue;
        background-color: burlywood;
        /*grid-row:start/end*/
        grid-row: 3/4;
        /*grid-column:start/end*/
        grid-column: 1/4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header box">Header</div>
      <div class="article box">Article</div>
      <div class="aside box">Aside</div>
      <div class="navbar box">Navbar</div>
      <div class="footer box">Footer</div>
    </div>
  </body>
</html>
