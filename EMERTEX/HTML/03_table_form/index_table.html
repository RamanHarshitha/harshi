<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
  </head>
  <body>
    <table border="2" style="border-collapse: collapse" align="center">
      <caption>
        <b>Employee Info</b>
      </caption>
      <thead>
        <tr>
          <th rowspan="2">SI.NO</th>
          <th rowspan="2">NAME</th>
          <th colspan="2">Marks</th>
        </tr>
        <tr>
            <td>sub1</td>
            <td>sub2</td>
        </tr>
      </thead>
      <tbody>
          <td rowspan="2">1</td>
          <td>ram</td>
          <td>40</td>
          <td>50</td>
        </tr>
        <tr>
          <td>sollu</td>
          <td>60</td>
          <td>50</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
